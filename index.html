<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>ONE EXPLOSION</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230E0E0F'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23FFB000' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23FFB000'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <!-- ===================== TITLE ===================== -->
  <section id="screen-title" class="screen active">
    <div class="title-wrap">
      <div class="title-mark">ONE</div>
      <h1 class="title-logo">EXPLOSION</h1>
      <p class="title-sub">爆弾を1個。最大の連鎖を。</p>
    </div>
    <div class="title-foot">
      <button id="btn-start" class="btn btn-accent btn-large">START</button>
      <div class="title-best">
        <span class="label">BEST CHAIN</span>
        <span id="title-best-chain" class="mono">0</span>
      </div>
    </div>
  </section>

  <!-- ===================== GAME ===================== -->
  <section id="screen-game" class="screen">
    <header class="hud">
      <div class="hud-item">
        <span class="label">STAGE</span>
        <span id="hud-stage" class="mono value">01</span>
      </div>
      <div class="hud-item hud-center">
        <span class="label">SCORE</span>
        <span id="hud-score" class="mono value value-lg">0</span>
      </div>
      <div class="hud-item hud-right">
        <span class="label">BEST CHAIN</span>
        <span id="hud-best" class="mono value">0</span>
      </div>
    </header>

    <div class="board-wrap">
      <canvas id="board-canvas" width="640" height="640"></canvas>
      <div id="chain-popup" class="chain-popup"></div>
    </div>

    <footer class="control">
      <div class="bomb-info">
        <div class="bomb-icon" id="bomb-icon">●</div>
        <div class="bomb-stats" id="bomb-stats">
          <span class="chip">RANGE <b id="stat-range">2</b></span>
        </div>
      </div>
      <button id="btn-blow" class="btn btn-danger btn-blow" disabled>BLOW</button>
    </footer>
  </section>

  <!-- ===================== RESULT ===================== -->
  <section id="screen-result" class="screen">
    <div class="result-wrap">
      <div class="result-label">STAGE CLEAR</div>
      <div class="result-main">
        <div class="result-row result-destroy">
          <span class="result-num mono" id="res-destroy">0%</span>
          <span class="result-tag">DESTROY</span>
        </div>
        <div class="result-row result-chain">
          <span class="result-num mono" id="res-chain">×0</span>
          <span class="result-tag">CHAIN</span>
        </div>
      </div>
      <div class="result-sub">
        <div class="result-mini">
          <span class="label">ELECTRIC</span>
          <span id="res-electric" class="mono">×0</span>
        </div>
        <div class="result-mini">
          <span class="label">MAX BURST</span>
          <span id="res-burst" class="mono">0</span>
        </div>
        <div class="result-mini">
          <span class="label">FULL CLEAR</span>
          <span id="res-fullclear" class="mono">—</span>
        </div>
      </div>
      <div class="result-total">
        <span class="label">TOTAL</span>
        <span id="res-total" class="mono value-xl">0</span>
      </div>
    </div>
    <button id="btn-result-next" class="btn btn-accent btn-large">NEXT</button>
  </section>

  <!-- ===================== UPGRADE ===================== -->
  <section id="screen-upgrade" class="screen">
    <div class="upgrade-head">
      <span class="label">SELECT UPGRADE</span>
      <h2 class="upgrade-title">爆弾を強化する</h2>
    </div>
    <div id="upgrade-cards" class="upgrade-cards"></div>
  </section>

  <!-- ===================== GAME OVER / FINAL ===================== -->
  <section id="screen-final" class="screen">
    <div class="final-wrap">
      <div class="final-label">RUN COMPLETE</div>
      <div class="final-score mono" id="final-score">0</div>
      <div class="final-sub">
        <div class="result-mini">
          <span class="label">BEST CHAIN</span>
          <span id="final-best-chain" class="mono">0</span>
        </div>
        <div class="result-mini">
          <span class="label">STAGES</span>
          <span id="final-stages" class="mono">0 / 0</span>
        </div>
      </div>
    </div>
    <button id="btn-retry" class="btn btn-accent btn-large">RETRY</button>
  </section>

</div>
<script src="src/app.js"></script>
</body>
</html>
